name: CI

on:
  pull_request:
  # The release workflow reuses these jobs for the commit it releases.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          golangci-lint: true
      - name: Format
        run: make fmt
      - name: Format changed nothing
        run: git diff --exit-code
      - name: Lint
        run: make lint
      - name: Vet
        run: make vet
      - name: Docs
        run: make docs
      - name: Docs changed nothing
        run: git diff --exit-code

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: true
      - name: Unit tests
        run: make test-unit

  e2e:
    name: e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: true
          helm: true
      # Starts the local registries with the Docker on the runner, and stops
      # them again.
      - name: E2E tests
        run: make test-e2e

  release-build:
    name: build tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: true
      # Builds every release target and checks each binary, so a target cannot
      # break unnoticed. Nothing is published.
      - name: Release build
        run: make test-release

  shell:
    name: shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          shellcheck: true
      - name: Lint the scripts
        run: make lint-sh
      - name: Test the scripts
        run: make test-sh

  install:
    name: install test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: true
      # Runs install.sh against a local fake release, so it needs no network and
      # installs nothing on the runner outside a temporary directory.
      - name: Install test
        run: make test-install
