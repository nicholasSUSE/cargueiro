version: "2"

run:
  build-tags:
    - e2e
    - release

linters:
  default: none
  enable:
    # Uber minimum set (goimports is under formatters)
    - errcheck
    - govet
    - staticcheck
    - revive
    # Uber rules
    - gochecknoinits
    - gochecknoglobals
    - errname
    - exhaustive
    - forcetypeassert
    - errorlint
    - predeclared
    # general hygiene
    - unused
    - ineffassign
    - gocritic

formatters:
  enable:
    - gofmt
    - goimports
