# Tool versions for developing cargueiro. Run `mise install` once.
# Docker CLI is pinned here, but the Docker daemon must run on the host.
#
# Order matters: mise gives earlier tools precedence on PATH. `go` stays last
# because its bin dir (GOBIN) can hold stale tools installed by editors.

[tools]
golangci-lint = "2.15.0"
shellcheck = "0.11.0"  # lints install.sh
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.2"
helm = "4.3.1"      # keep equal to helm.sh/helm/v4 in go.mod
oras = "1.3.6"
crane = "0.22.1"
docker-cli = "29.9.2"
go = "1.27.2"
