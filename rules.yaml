# Which charts cargueiro checks, the kind of each, and the annotations each kind
# requires. internal/rules parses this file and internal/annotations applies it.
# A chart that is not listed is an error. See "Chart annotation rules" in
# docs/DEVELOPING.md.
#
# Every chart has an edition: rancher-charts or prime-charts. A family never mixes
# editions. The registries section says where the charts of each edition and the
# images are released to; push uses it to protect the SUSE registries.
#
# A crd or extra chart keeps its icon as it is, and so does a main chart marked
# icon: skip. Any other chart must have an icon that can be made local.
#
# A main chart may say upstream, the address of the repository that releases it,
# as https://github.com/<organization>/<repository>. It is optional, and a crd or
# extra chart is released from the repository of its main chart.
#
# Data source: latest Chart.yaml of every chart in rancher/charts release-v2.15
# (be246f515, 2026-10-29). The prime-charts entries are the charts of
# prime-charts release-v2.13, v2.14 and v2.15.

# Annotation names are under catalog.cattle.io/ .
# namespace is optional for every kind.
kinds:
  main:   # a product chart, with or without a -crd sibling
    required: [release-name, certified, rancher-version, kube-version, permits-os]
  crd:    # CRDs only; always hidden
    required: [release-name, certified, hidden]
  extra:  # companions and add-ons that are not a product chart on their own
    required: [certified, rancher-version, kube-version, permits-os]

# release-name is the chart name unless given here.
families:
  - family: elemental
    charts:
      - { name: elemental, kind: main, release-name: elemental-operator, edition: rancher-charts }
      - { name: elemental-crd, kind: crd, release-name: elemental-operator-crds, edition: rancher-charts }
  - family: fleet
    charts:
      - { name: fleet, kind: main, edition: rancher-charts, icon: skip, upstream: https://github.com/rancher/fleet }
      - { name: fleet-agent, kind: extra, edition: rancher-charts }
      - { name: fleet-crd, kind: crd, edition: rancher-charts }
  - family: harvester-rbac
    charts:
      - { name: harvester-rbac, kind: main, edition: rancher-charts, icon: skip, upstream: https://github.com/harvester/charts }
  - family: longhorn
    charts:
      - { name: longhorn, kind: main, edition: rancher-charts, upstream: https://github.com/longhorn/charts }
      - { name: longhorn-crd, kind: crd, edition: rancher-charts }
  - family: neuvector
    charts:
      - { name: neuvector, kind: main, edition: rancher-charts, upstream: https://github.com/neuvector/neuvector-helm }
      - { name: neuvector-crd, kind: crd, edition: rancher-charts }
      - { name: neuvector-monitor, kind: extra, edition: rancher-charts }
  - family: prometheus-federator
    charts:
      - { name: prometheus-federator, kind: main, edition: rancher-charts, upstream: https://github.com/rancher/prometheus-federator }
  - family: rancher-aks-operator
    charts:
      - { name: rancher-aks-operator, kind: main, edition: rancher-charts, icon: skip, upstream: https://github.com/rancher/aks-operator }
      - { name: rancher-aks-operator-crd, kind: crd, edition: rancher-charts }
  - family: rancher-backup
    charts:
      - { name: rancher-backup, kind: main, edition: rancher-charts, upstream: https://github.com/rancher/backup-restore-operator }
      - { name: rancher-backup-crd, kind: crd, edition: rancher-charts }
  - family: rancher-compliance
    charts:
      - { name: rancher-compliance, kind: main, edition: rancher-charts, upstream: https://github.com/rancher/compliance-operator }
      - { name: rancher-compliance-crd, kind: crd, edition: rancher-charts }
  - family: rancher-eks-operator
    charts:
      - { name: rancher-eks-operator, kind: main, edition: rancher-charts, icon: skip, upstream: https://github.com/rancher/eks-operator }
      - { name: rancher-eks-operator-crd, kind: crd, edition: rancher-charts }
  - family: rancher-gke-operator
    charts:
      - { name: rancher-gke-operator, kind: main, edition: rancher-charts, icon: skip, upstream: https://github.com/rancher/gke-operator }
      - { name: rancher-gke-operator-crd, kind: crd, edition: rancher-charts }
  - family: rancher-logging
    charts:
      - { name: rancher-logging, kind: main, edition: rancher-charts, upstream: https://github.com/rancher/ob-team-charts }
      - { name: rancher-logging-crd, kind: crd, edition: rancher-charts }
  - family: rancher-monitoring
    charts:
      - { name: rancher-monitoring, kind: main, edition: rancher-charts, upstream: https://github.com/rancher/ob-team-charts }
      - { name: rancher-monitoring-crd, kind: crd, edition: rancher-charts }
  - family: rancher-monitoring-dashboards
    charts:
      - { name: rancher-monitoring-dashboards, kind: main, edition: rancher-charts, upstream: https://github.com/rancher/ob-team-charts }
  - family: rancher-supportability-review
    charts:
      - { name: rancher-supportability-review, kind: main, edition: rancher-charts }
      - { name: rancher-supportability-review-crd, kind: crd, edition: rancher-charts }
  - family: rancher-turtles
    charts:
      - { name: rancher-turtles, kind: main, edition: rancher-charts, upstream: https://github.com/rancher/turtles }
  - family: rancher-webhook
    charts:
      - { name: rancher-webhook, kind: main, edition: rancher-charts, icon: skip, upstream: https://github.com/rancher/webhook }
  - family: remotedialer-proxy
    charts:
      - { name: remotedialer-proxy, kind: main, edition: rancher-charts, icon: skip, upstream: https://github.com/rancher/remotedialer-proxy }  # known violation: no kube-version, fix upstream
  - family: system-upgrade-controller
    charts:
      - { name: system-upgrade-controller, kind: main, edition: rancher-charts, version: plain, icon: skip, upstream: https://github.com/rancher/system-upgrade-controller }

  - family: rancher-ai-agent
    charts:
      - { name: rancher-ai-agent, kind: main, release-name: cattle-ai-agent-system, edition: prime-charts }
  - family: rancher-ali-operator
    charts:
      - { name: rancher-ali-operator, kind: main, edition: prime-charts, icon: skip, upstream: https://github.com/rancher/ali-operator }
      - { name: rancher-ali-operator-crd, kind: crd, edition: prime-charts }
  - family: rancher-turtles-providers
    charts:
      - { name: rancher-turtles-providers, kind: main, edition: prime-charts }  # probably extra; main until its use is clear

# Where charts and images are released to: host/path, no scheme, no trailing slash.
registries:
  rancher-charts:
    charts-staging: stgregistry.suse.com/rancher/catalog
    charts-production: registry.suse.com/rancher/catalog
  prime-charts:
    charts-staging: stgregistry.suse.com/rancher/charts
    charts-production: registry.suse.com/rancher/charts
  images:
    staging: stgregistry.suse.com/rancher
    production: registry.suse.com/rancher

# The chart version is 1XY.Z.W+upA.B.C, or 1XY.Z.W for a chart marked
# version: plain. A prerelease follows the +up part, as in -rc.1, and only these
# names are allowed, and their order is their rank, newest first. The major
# (1XY) belongs to the Rancher version the chart targets.
versions:
  prereleases: [rancher, rc, beta, alpha]
  majors:
    "2.15": 110
    "2.16": 111
    "2.17": 112
    "2.18": 113
    "2.19": 114
